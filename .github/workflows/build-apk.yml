name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  statuses: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Web Assets
        run: npm run build

      - name: Copy Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          echo "[]" > android/app/src/main/assets/capacitor.plugins.json
          touch android/app/src/main/assets/public/cordova.js
          touch android/app/src/main/assets/public/cordova_plugins.js

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses and Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Build Debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          if ! ./gradlew :app:assembleDebug -PcompileSdkVersion=36 -PtargetSdkVersion=36 --no-daemon --stacktrace 2>&1 | tee ../gradle_build.log; then
            PASTE_URL=$(curl -s --data-binary @../gradle_build.log https://paste.rs || true)
            echo "Gradle build log: $PASTE_URL"
            curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -d "{\"state\": \"failure\", \"target_url\": \"$PASTE_URL\", \"description\": \"Log: $PASTE_URL\", \"context\": \"gradle-log\"}" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" || true
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Copy and Prepare APK
        run: |
          echo "=== SEARCHING FOR APK ==="
          find . -name "*.apk"
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" ./Resetando.apk
            ls -lh ./Resetando.apk
          else
            echo "No APK found. Showing last 50 lines of build log:"
            tail -n 50 gradle_build.log
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resetando-APK
          path: ./Resetando.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 ./Resetando.apk --title "Resetando App (Android APK)" --notes "Baixe o arquivo Resetando.apk e instale diretamente no seu celular Android." --clobber || true
